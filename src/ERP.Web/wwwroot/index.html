<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Administrativo — ERP SaaS</title>
<style>
  :root {
    --bg: #f4f6fb;
    --surface: #ffffff;
    --border: #e4e8f0;
    --text: #1e2433;
    --muted: #6b7385;
    --primary: #3b5bdb;
    --primary-hover: #3249b8;
    --danger: #d64545;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* ===== Login ===== */
  .login-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .login-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 40px;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 8px 30px rgba(30, 36, 51, .07);
  }
  .login-card h1 { font-size: 20px; margin-bottom: 4px; }
  .login-card p { color: var(--muted); font-size: 13px; margin-bottom: 24px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
  .field input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    background: #fbfcfe;
  }
  .field input:focus { outline: 2px solid var(--primary); outline-offset: -1px; border-color: transparent; }
  button.btn {
    width: 100%;
    padding: 11px;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button.btn:hover { background: var(--primary-hover); }
  button.btn:disabled { opacity: .6; cursor: wait; }
  .alert {
    display: none;
    background: #fdeaea;
    color: var(--danger);
    border-radius: 8px;
    font-size: 13px;
    padding: 10px 12px;
    margin-bottom: 14px;
  }

  /* ===== Painel ===== */
  .hidden { display: none !important; }
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 { font-size: 17px; }
  header .user-info { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 12px; }
  header .logout {
    background: none;
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 7px 14px;
    font-size: 13px;
    cursor: pointer;
    color: var(--text);
    width: auto;
  }
  header .logout:hover { background: #f0f2f7; }

  main { max-width: 1160px; margin: 0 auto; padding: 28px; }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; margin-bottom: 22px; }
  .stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
  }
  .stat .num { font-size: 26px; font-weight: 700; }
  .stat .lbl { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .toolbar {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px 12px 0 0;
    padding: 14px 18px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }
  .toolbar input, .toolbar select {
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 13px;
    background: #fbfcfe;
  }
  .toolbar input[type="search"] { flex: 1; min-width: 200px; }

  .table-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-top: none;
    border-radius: 0 0 12px 12px;
    overflow-x: auto;
  }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  thead th {
    text-align: left;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--muted);
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  tbody td { padding: 13px 16px; border-bottom: 1px solid #f0f2f6; vertical-align: middle; }
  tbody tr:last-child td { border-bottom: none; }
  .who { display: flex; align-items: center; gap: 12px; }
  .avatar {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: var(--primary);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
    flex-shrink: 0;
  }
  .who .name { font-weight: 600; }
  .who .email { font-size: 12px; color: var(--muted); }
  .muted { color: var(--muted); font-size: 13px; }

  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    margin-right: 5px;
    white-space: nowrap;
  }
  .badge-role { background: #e8edfb; color: #3b5bdb; }
  .badge-active { background: #e5f6ec; color: #1f7a44; }
  .badge-pending { background: #fdf3d7; color: #97701a; }
  .badge-inactive { background: #eef0f4; color: #6b7385; }
  .badge-suspended { background: #fdeaea; color: #c03535; }
  .badge-deleted { background: #e9e9e9; color: #8a8a8a; }
  .badge-trial { background: #e8edfb; color: #3b5bdb; }
  .badge-pastdue { background: #fdf3d7; color: #97701a; }
  .badge-cancelled, .badge-expired { background: #fdeaea; color: #c03535; }
  .badge-none { background: #eef0f4; color: #8a93a6; }

  .pager { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; font-size: 13px; color: var(--muted); }
  .pager .actions { display: flex; gap: 8px; }
  .pager button {
    background: none; border: 1px solid var(--border); border-radius: 7px;
    padding: 6px 14px; font-size: 13px; cursor: pointer; width: auto;
  }
  .pager button:disabled { opacity: .4; cursor: default; }
  .empty { text-align: center; padding: 40px; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>

<!-- Login -->
<div class="login-wrap" id="login-view">
  <form class="login-card" id="login-form">
    <h1>Painel Administrativo</h1>
    <p>ERP SaaS — Gerenciamento de usuários</p>
    <div class="alert" id="login-error"></div>
    <div class="field">
      <label for="username">Usuário</label>
      <input id="username" name="username" autocomplete="username" required>
    </div>
    <div class="field">
      <label for="password">Senha</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn" id="login-btn">Entrar</button>
  </form>
</div>

<!-- Painel -->
<div class="hidden" id="panel-view">
  <header>
    <h1>Painel Administrativo — Usuários</h1>
    <div class="user-info">
      <span id="logged-user"></span>
      <button class="logout" id="logout-btn">Sair</button>
    </div>
  </header>
  <main>
    <section class="stats">
      <div class="stat"><div class="num" id="stat-total">–</div><div class="lbl">Total de usuários</div></div>
      <div class="stat"><div class="num" id="stat-active">–</div><div class="lbl">Usuários ativos</div></div>
      <div class="stat"><div class="num" id="stat-admins">–</div><div class="lbl">Administradores</div></div>
      <div class="stat"><div class="num" id="stat-trial">–</div><div class="lbl">Assinaturas em trial</div></div>
    </section>

    <div class="toolbar">
      <input type="search" id="search" placeholder="Buscar por nome, usuário ou e-mail…">
      <select id="role-filter">
        <option value="">Todos os papéis</option>
        <option value="Admin">Admin</option>
        <option value="TenantAdmin">TenantAdmin</option>
        <option value="User">User</option>
      </select>
      <select id="status-filter">
        <option value="">Todos os status</option>
        <option value="Pending">Pendente</option>
        <option value="Active">Ativo</option>
        <option value="Inactive">Inativo</option>
        <option value="Suspended">Suspenso</option>
        <option value="Deleted">Excluído</option>
      </select>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Usuário</th>
            <th>Papéis atribuídos</th>
            <th>Status</th>
            <th>Tenant</th>
            <th>Assinatura</th>
            <th>Último acesso</th>
          </tr>
        </thead>
        <tbody id="users-tbody"></tbody>
      </table>
      <div class="empty hidden" id="empty-state">Nenhum usuário encontrado.</div>
      <div class="pager">
        <span id="page-info"></span>
        <div class="actions">
          <button id="prev-page">Anterior</button>
          <button id="next-page">Próxima</button>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
(function () {
  "use strict";

  var token = sessionStorage.getItem("admin_token") || "";
  var state = { page: 1, pageSize: 20, search: "", role: "", status: "" };

  var $ = function (id) { return document.getElementById(id); };

  // ---- Labels (API serializa enums como número) ----
  var STATUS_LABELS = { 0: "Pendente", 1: "Ativo", 2: "Inativo", 3: "Suspenso", 4: "Excluído" };
  var STATUS_KEYS = { 0: "pending", 1: "active", 2: "inactive", 3: "suspended", 4: "deleted" };
  var SUB_LABELS = { 0: "Trial", 1: "Ativa", 2: "Pagamento pendente", 3: "Cancelada", 4: "Expirada" };
  var SUB_KEYS = { 0: "trial", 1: "active", 2: "pastdue", 3: "cancelled", 4: "expired" };

  function badge(kind, text) {
    return '<span class="badge badge-' + kind + '">' + esc(text) + "</span>";
  }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function initials(name) {
    return (name || "?").split(/\s+/).map(function (w) { return w[0]; }).join("").slice(0, 2).toUpperCase();
  }

  function fmtDate(iso) {
    if (!iso) return "—";
    var d = new Date(iso);
    return d.toLocaleDateString("pt-BR") + " " + d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
  }

  // ---- API ----
  function api(path, opts) {
    opts = opts || {};
    opts.headers = Object.assign({ "Content-Type": "application/json" }, opts.headers || {});
    if (token) opts.headers["Authorization"] = "Bearer " + token;
    return fetch(path, opts).then(function (res) {
      return res.json().then(function (body) {
        if (!res.ok || body.success === false) {
          throw new Error(body.message || res.statusText);
        }
        return body;
      });
    });
  }

  // ---- Login ----
  $("login-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var btn = $("login-btn");
    $("login-error").style.display = "none";
    btn.disabled = true;
    fetch("/api/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: $("username").value, password: $("password").value })
    })
      .then(function (res) { return res.json(); })
      .then(function (body) {
        if (!body.success || !body.data || !body.data.token) {
          throw new Error(body.message || "Falha no login");
        }
        token = body.data.token;
        sessionStorage.setItem("admin_token", token);
        showPanel();
      })
      .catch(function (err) {
        var el = $("login-error");
        el.textContent = err.message || "Usuário ou senha inválidos.";
        el.style.display = "block";
      })
      .finally(function () { btn.disabled = false; });
  });

  function showPanel() {
    $("login-view").classList.add("hidden");
    $("panel-view").classList.remove("hidden");
    var me = parseJwt(token);
    var who = me && (me.unique_name || me.nameid);
    if (Array.isArray(who)) who = who[who.length - 1];
    $("logged-user").textContent = who || "administrador";
    loadUsers();
  }

  function parseJwt(t) {
    try {
      var payload = t.split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
      return JSON.parse(decodeURIComponent(escape(atob(payload))));
    } catch (e) { return null; }
  }

  $("logout-btn").addEventListener("click", function () {
    sessionStorage.removeItem("admin_token");
    token = "";
    $("panel-view").classList.add("hidden");
    $("login-view").classList.remove("hidden");
    $("password").value = "";
  });

  // ---- Listagem ----
  function loadUsers() {
    var q = "?pageNumber=" + state.page + "&pageSize=" + state.pageSize;
    if (state.search) q += "&search=" + encodeURIComponent(state.search);
    if (state.role) q += "&role=" + encodeURIComponent(state.role);
    if (state.status) q += "&status=" + encodeURIComponent(state.status);

    api("/api/users" + q)
      .then(function (res) {
        // PagedResponse vem aninhada: res.data = { pageNumber, totalCount, data: [...] }
        var body = res.data || {};
        var users = body.data || [];
        state.page = body.pageNumber;
        renderRows(users);
        $("page-info").textContent = "Página " + body.pageNumber + " de " + (body.totalPages || 1) + " — " + body.totalCount + " usuário(s)";
        $("prev-page").disabled = !body.hasPreviousPage;
        $("next-page").disabled = !body.hasNextPage;
        loadStats();
      })
      .catch(function (err) {
        if (/401|Unauthorized|Authentication/i.test(err.message)) {
          sessionStorage.removeItem("admin_token");
          token = "";
          $("panel-view").classList.add("hidden");
          $("login-view").classList.remove("hidden");
        } else {
          alert("Erro ao carregar usuários: " + err.message);
        }
      });
  }

  // Estatísticas com base na página completa (sem filtros), para visão geral
  function loadStats() {
    api("/api/users?pageNumber=1&pageSize=500")
      .then(function (res) {
        var body = res.data || {};
        var users = body.data || [];
        $("stat-total").textContent = body.totalCount;
        $("stat-active").textContent = users.filter(function (u) { return u.status === 1; }).length;
        $("stat-admins").textContent = users.filter(function (u) { return (u.roles || []).indexOf("Admin") >= 0; }).length;
        $("stat-trial").textContent = users.filter(function (u) { return u.tenant && u.tenant.subscriptionStatus === 0; }).length;
      })
      .catch(function () { /* mantém os contadores anteriores */ });
  }

  function renderRows(users) {
    var tbody = $("users-tbody");
    tbody.innerHTML = "";
    $("empty-state").classList.toggle("hidden", users.length > 0);

    users.forEach(function (u) {
      var roles = (u.roles || []).map(function (r) { return badge("role", r); }).join("") || '<span class="muted">—</span>';
      var status = badge(STATUS_KEYS[u.status] || "none", STATUS_LABELS[u.status] || u.status);

      var tenantCell, subCell;
      if (u.tenant) {
        tenantCell = '<div class="name" style="font-size:13px">' + esc(u.tenant.name) + "</div>";
        if (u.tenant.subscriptionStatus != null) {
          subCell = badge(SUB_KEYS[u.tenant.subscriptionStatus] || "none", SUB_LABELS[u.tenant.subscriptionStatus] || u.tenant.subscriptionStatus) +
            '<div class="muted" style="margin-top:4px">' + esc(u.tenant.planName || "Sem plano") +
            (u.tenant.subscriptionEndDate ? " · até " + new Date(u.tenant.subscriptionEndDate).toLocaleDateString("pt-BR") : "") + "</div>";
        } else {
          subCell = badge("none", "Sem assinatura");
        }
      } else {
        tenantCell = '<span class="muted">Global (sem tenant)</span>';
        subCell = badge("none", "—");
      }

      var tr = document.createElement("tr");
      tr.innerHTML =
        '<td><div class="who"><div class="avatar">' + esc(initials(u.fullName)) + '</div><div><div class="name">' +
        esc(u.fullName || u.userName) + '</div><div class="email">' + esc(u.email) + "</div></div></div></td>" +
        "<td>" + roles + "</td>" +
        "<td>" + status + "</td>" +
        "<td>" + tenantCell + "</td>" +
        "<td>" + subCell + "</td>" +
        '<td class="muted">' + fmtDate(u.lastLogin) + "</td>";
      tbody.appendChild(tr);
    });
  }

  // ---- Filtros e paginação ----
  var searchTimer;
  $("search").addEventListener("input", function () {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function () {
      state.search = $("search").value.trim();
      state.page = 1;
      loadUsers();
    }, 300);
  });
  $("role-filter").addEventListener("change", function () {
    state.role = $("role-filter").value;
    state.page = 1;
    loadUsers();
  });
  $("status-filter").addEventListener("change", function () {
    state.status = $("status-filter").value;
    state.page = 1;
    loadUsers();
  });
  $("prev-page").addEventListener("click", function () { state.page--; loadUsers(); });
  $("next-page").addEventListener("click", function () { state.page++; loadUsers(); });

  // Sessão salva: entra direto no painel
  if (token) showPanel();
})();
</script>
</body>
</html>
