<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Administrativo — ERP SaaS</title>
<link rel="stylesheet" href="/css/panel.css">
</head>
<body>

<!-- Login -->
<div class="login-wrap" id="login-view">
  <form class="login-card" id="login-form">
    <h1>Painel Administrativo</h1>
    <p>ERP SaaS — Gerenciamento de usuários</p>
    <div class="alert" id="login-error"></div>
    <div class="field">
      <label for="username">Usuário</label>
      <input id="username" name="username" autocomplete="username" required>
    </div>
    <div class="field">
      <label for="password">Senha</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn" id="login-btn">Entrar</button>
  </form>
</div>

<!-- Painel -->
<div class="hidden" id="panel-view">
  <header>
    <h1>Painel Administrativo — Usuários</h1>
    <div class="user-info">
      <span id="logged-user"></span>
      <button class="logout" id="logout-btn">Sair</button>
    </div>
  </header>
  <main>
    <section class="stats">
      <div class="stat"><div class="num" id="stat-total">–</div><div class="lbl">Total de usuários</div></div>
      <div class="stat"><div class="num" id="stat-active">–</div><div class="lbl">Usuários ativos</div></div>
      <div class="stat"><div class="num" id="stat-admins">–</div><div class="lbl">Administradores</div></div>
      <div class="stat"><div class="num" id="stat-trial">–</div><div class="lbl">Assinaturas em trial</div></div>
    </section>

    <div class="toolbar">
      <input type="search" id="search" placeholder="Buscar por nome, usuário ou e-mail…">
      <select id="role-filter">
        <option value="">Todos os papéis</option>
      </select>
      <select id="status-filter">
        <option value="">Todos os status</option>
        <option value="Pending">Pendente</option>
        <option value="Active">Ativo</option>
        <option value="Inactive">Inativo</option>
        <option value="Suspended">Suspenso</option>
        <option value="Deleted">Excluído</option>
      </select>
      <button class="btn" id="new-user-btn">+ Novo usuário</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Usuário</th>
            <th>Papéis atribuídos</th>
            <th>Status</th>
            <th>Tenant</th>
            <th>Assinatura</th>
            <th>Último acesso</th>
          </tr>
        </thead>
        <tbody id="users-tbody"></tbody>
      </table>
      <div class="empty hidden" id="empty-state">Nenhum usuário encontrado.</div>
      <div class="pager">
        <span id="page-info"></span>
        <div class="actions">
          <button id="prev-page">Anterior</button>
          <button id="next-page">Próxima</button>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="/js/panel.js"></script>
</body>
</html>
