services:
  # Frontend (React + Vite, roda do código com hot reload)
  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "3000:5173"
    environment:
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - CHOKIDAR_USEPOLLING=true
    command: >
      sh -c "npm install --no-audit --no-fund
      && npm run dev"
    depends_on:
      - web
    restart: unless-stopped

  # ERP Web API (dev mode - runs from source with hot reload)
  web:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "8000:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - AppSettings__Database__MasterConnectionString=Host=erp-db;Port=5432;Database=erp_master;Username=postgres;Password=ErpSaas2024!
      - AppSettings__Cors__AllowedOrigins__0=https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
      - AppSettings__Cors__AllowedOrigins__1=http://3000-${BASE44_PUBLIC_HOST_SUFFIX}
    command: >
      sh -c "dotnet restore src/ERP.Web/ERP.Web.csproj
      && dotnet watch run --project src/ERP.Web/ERP.Web.csproj --urls http://0.0.0.0:80 --no-hot-reload"
    depends_on:
      erp-db:
        condition: service_healthy
    restart: unless-stopped

  # PostgreSQL database
  erp-db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=ErpSaas2024!
      - POSTGRES_DB=erp_master
    volumes:
      - erp-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d erp_master"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  erp-db-data:
  frontend_node_modules:
